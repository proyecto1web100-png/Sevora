name: Publicar en GitHub Pages

# Construye la web y la sube a la rama gh-pages, que GitHub Pages publica en
# https://proyecto1web100-png.github.io/Sevora/
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Cada 3 horas, para que los perfumes nuevos de la hoja de Google Sheets tengan su página.
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_CATALOG_CSV_URL: ${{ vars.CATALOG_CSV_URL }}
      - name: Subir dist/ a la rama gh-pages
        working-directory: dist
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicar ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
